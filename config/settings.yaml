# JagX Configuration
# JRILICENSE

app:
  name: "JagX"
  version: "0.3.0-dev"
  license: "JRILICENSE"

llm:
  provider: "ollama"          # local Ollama is preferred
  model: "qwen2.5"             # JagX prefers qwen2.5 when installed, with automatic fallback
  base_url: "http://localhost:11434"
  temperature: 0.7
  auto_detect_models: true

voice:
  enabled: true
  wake_word: "jagx"
  stt_model: "base"
  tts_voice: "en-US-AriaNeural"
  language: "en"
  silence_threshold: 0.015
  silence_duration: 1.4
  max_record_seconds: 25

safety:
  high_risk_only: true
  blocked_commands:
    - "rm -rf /"
    - "format"
    - "mkfs"

system:
  platform: "auto"
  tray_icon: true
  always_on: true

memory:
  enabled: true
  path: "./data/memory"
