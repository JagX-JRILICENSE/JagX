# JagX Configuration
# JRILICENSE

app:
  name: "JagX"
  version: "0.2.0-dev"
  license: "JRILICENSE"

llm:
  provider: "ollama"          # ollama | openai_compatible
  model: "llama3.1"           # Change to your preferred local model
  base_url: "http://localhost:11434"
  temperature: 0.7

voice:
  enabled: true
  wake_word: "jagx"
  stt_model: "base"           # base | small | medium | large-v3 (bigger = more accurate, slower)
  tts_voice: "en-US-AriaNeural"  # edge-tts voice
  language: "en"
  silence_threshold: 0.015
  silence_duration: 1.4
  max_record_seconds: 25

safety:
  # Only confirm on high-risk / hacking-related actions
  high_risk_only: true
  blocked_commands:
    - "rm -rf /"
    - "format"
    - "mkfs"

system:
  platform: "auto"
  tray_icon: true
  always_on: true

memory:
  enabled: true
  path: "./data/memory"
