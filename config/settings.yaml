# JagX Configuration
# JRILICENSE

app:
  name: "JagX"
  version: "0.6.0"
  license: "JRILICENSE"

llm:
  provider: "ollama"
  model: "qwen2.5:3b"          # fast chat model (avoid coder:1.5b for control)
  base_url: "http://127.0.0.1:11434"
  temperature: 0.4
  timeout: 90
  auto_detect_models: true
  auto_pull_model: true

voice:
  enabled: true
  wake_word: "jagx"
  stt_model_size: "base"
  tts_voice: "en-US-AriaNeural"
  language: "en"

safety:
  high_risk_only: true

system:
  platform: "auto"
  tray_icon: true
  always_on: true

memory:
  enabled: true
  path: "./data/memory"

idle_power:
  enabled: false
  timeout_minutes: 30
  action: "sleep"
